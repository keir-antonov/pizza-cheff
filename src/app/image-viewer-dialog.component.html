<div class="image-viewer" (click)="close()" (keydown.escape)="close()" tabindex="0">
    <button type="button" class="close-button" (click)="close(); $event.stopPropagation()" aria-label="Закрыть">
        ×
    </button>
    <span class="dialog-image-wrap">
        <img [ngSrc]="data.src" fill [alt]="data.name">
    </span>
</div>
